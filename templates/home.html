<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>20 Super Wins</title>
    <link rel="stylesheet" href="{{ url_for('static', path='styles/main.css') }}">
</head>
<body>
    
    <div class="container">
        <h1 class="title">20 SUPER WINS</h1>
        <div class="game">
            <div id="screen">
                {% for reel in screen %}
                    <div class="reel">
                        <div class="strip">
                            <div class="symbol">{{ reel[1] }}</div>
                            {% for symbol in reel %}
                                <div class="symbol">{{ symbol }}</div>
                            {% endfor %}
                        </div>
                    </div>
                {% endfor %}
            </div>
        </div>
    <div class="control-buttons">
        <button id="double-button" type="button" ><span>x2</span></button>
        <button id="spin-button" type="button" ><img height="100" width="100" src="{{ url_for('static', path='img/spin-start.svg') }}" alt="spin button"></button>
        <button id="stop-button" type="button" ><img height="100" width="100" src="{{ url_for('static', path='img/spin-stop.svg') }}" alt="stop button"></button>
        <button id="receive-button" type="button" ><img height="40" width="40" src="{{ url_for('static', path='img/receive.png') }}" alt="receive win button"></button>
    </div>
        <div class="player-bar">
            <div class="notification-bar">
                <p id="player-alert"></p>
            </div>
            <div id="balance">
                <span>Balance</span>
                <span id="balance-number"></span>
            </div>
            <div id="bet-select">
                <button class="bet-amount" type="button" data-bet="10">$10</button>
                <button class="bet-amount" type="button" data-bet="20">$20</button>
                <button class="bet-amount" type="button" data-bet="40">$40</button>
                <button class="bet-amount" type="button" data-bet="80">$80</button>
                <button class="bet-amount" type="button" data-bet="120">$120</button>
            </div>
            <div id="winnings">
                <span id="win-label">Winnings</span>
                <span id="win-number"></span>
            </div>
        </div>
    </div>
    <button id="reset-balance" type="button">Reset Balance</button>
    <script src="{{ url_for('static', path='js/main.js') }}"></script>
</body>
</html>
