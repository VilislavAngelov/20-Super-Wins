services:

  casino:
    build: .
    restart: always
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - default
      - angelops

  db:
    image: postgres:18
    restart: always
    volumes:
      - pgdata:/var/lib/postgresql
    shm_size: 128mb
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${DB_USER}", "-d", "${DB_NAME}"]
      interval: 5s
      retries: 5


volumes:
  pgdata:

networks:
  angelops:
    external: true
